<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="calc-body">
        <div id="calc-display">
            <div id="calc-screen">000,000,000,000</div>
        </div>
        <div id="calc-keypad">
            <div class="calc-keys-row">
                <div class="calc-single-key calc-ctrl-keys">AC</div>
                <div class="calc-single-key calc-ctrl-keys">CLR</div>
                <div class="calc-single-key calc-operation-keys">/</div>
                <div class="calc-single-key calc-operation-keys">*</div>
            </div>
            <div class="calc-keys-row">
                <div class="calc-single-key">7</div>
                <div class="calc-single-key">8</div>
                <div class="calc-single-key">9</div>
                <div class="calc-single-key calc-operation-keys">-</div>
            </div>
            <div class="calc-keys-row">
                <div class="calc-single-key">4</div>
                <div class="calc-single-key">5</div>
                <div class="calc-single-key">6</div>
                <div class="calc-single-key calc-operation-keys">+</div>
            </div>
            <div class="calc-2keys-row">
                <div id="keys-0to3">
                    <div class="key-0123ndPoint" id="keys-1to3">
                        <div class="calc-single-key">1</div>
                        <div class="calc-single-key">2</div>
                        <div class="calc-single-key">3</div>
                    </div>
                    <div class="key-0123ndPoint" id="key-0ndPoint">
                        <div id="key-0">0</div>
                        <div class="calc-single-key">.</div>
                    </div>
                </div>
                <div id="key-eq">=</div>
            </div>
        </div>
    </div>
</body>
</html>
